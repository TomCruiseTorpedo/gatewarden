name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Score-engine drift guard
        run: bun run --filter '@gatewarden/score' check:score-sync
      # Asserts this repo's manifest is byte-identical to mcp-fit's. The step
      # above only proves this repo is internally consistent — both repos can
      # pass it while the vendored engines diverge. Expect a transient red
      # between the two halves of a two-repo change; land them back-to-back.
      - name: Score-engine cross-repo assertion
        run: bun run --filter '@gatewarden/score' check:score-cross
