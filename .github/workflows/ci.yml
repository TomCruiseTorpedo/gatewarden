name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # packages/* depend on each other by concrete version rather than
      # "workspace:*", so that npm can parse the manifests and produce the
      # package-lock.json GitHub's dependency graph needs. The cost is that a
      # sibling version bump silently redirects a dependent at the published
      # tarball instead of the local source. This makes that drift loud.
      - name: Workspace pin guard
        run: bun run check:workspace-pins
      - name: Score-engine drift guard
        run: bun run --filter '@gatewarden/score' check:score-sync
      # Asserts this repo's manifest is byte-identical to mcp-fit's. The step
      # above only proves this repo is internally consistent — both repos can
      # pass it while the vendored engines diverge. Expect a transient red
      # between the two halves of a two-repo change; land them back-to-back.
      - name: Score-engine cross-repo assertion
        run: bun run --filter '@gatewarden/score' check:score-cross
      - name: Govern-engine drift guard
        run: bun run --filter '@gatewarden/govern' check:govern-sync
      # Asserts this repo's manifest is byte-identical to leasebroker's. Same
      # reasoning as the score assertion above: the local guard alone lets both
      # repos stay green while the vendored engines diverge.
      - name: Govern-engine cross-repo assertion
        run: bun run --filter '@gatewarden/govern' check:govern-cross
